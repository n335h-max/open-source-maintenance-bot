services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: maintenance_bot
    ports: ["5432:5432"]
    volumes: ["bot-db:/var/lib/postgresql/data"]
  api:
    build: .
    command: ["node", "dist/src/server.js"]
    env_file: .env
    depends_on: [postgres]
    ports: ["3000:3000"]
    read_only: true
    tmpfs: ["/tmp"]
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file: .env
    depends_on: [postgres]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs: ["/tmp"]
volumes:
  bot-db:
